name: Deploy API, Dashboard & Website
on:
  push:
    branches:
      - staging
      - production
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-staging:
    name: Staging Deployment
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/staging'
    runs-on: ubuntu-latest
    environment: staging
    concurrency:
      group: deploy-staging
      cancel-in-progress: true
    steps:
      - name: Deploy API & dashboard on staging server
        uses: appleboy/ssh-action@v1
        id: ssh
        with:
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          port: ${{ secrets.SSH_PORT }}
          capture_stdout: true
          script: |
            set -e
            PNPM_VERSION="10.6.1"
            DEPLOY_PATH="${{ secrets.DEPLOY_PATH }}"
            DEPLOY_BRANCH="${{ github.ref_name }}"
            SHARED="$DEPLOY_PATH/shared"   # persistent across deploys
            RELEASE="$DEPLOY_PATH/current" # the standalone API artifact we run

            # --- Update the build checkout (build source only) ---
            cd "$DEPLOY_PATH"
            git config --global --add safe.directory "$DEPLOY_PATH"
            git fetch --all --prune
            git checkout "$DEPLOY_BRANCH"
            git reset --hard "origin/$DEPLOY_BRANCH"

            source ~/.nvm/nvm.sh
            echo "node $(node -v) · pnpm $(pnpm -v) · pm2 $(pm2 -v)"
            corepack enable
            corepack prepare "pnpm@${PNPM_VERSION}" --activate

            # --- Persistent shared state ($DEPLOY_PATH/shared): .env + storage ---
            mkdir -p "$SHARED/storage/app"
            if [ ! -f "$SHARED/.env" ]; then
              cp apps/api/.env.example "$SHARED/.env"
              echo "::warning::Seeded $SHARED/.env from .env.example — set APP_KEY, DATABASE_URL, etc."
            fi
            if [ -n "${{ secrets.FIREBASE_ADMINSDK }}" ]; then
              printf '%s\n' '${{ secrets.FIREBASE_ADMINSDK }}' > "$SHARED/storage/app/firebase-adminsdk.json"
              chmod 600 "$SHARED/storage/app/firebase-adminsdk.json"
            fi
            # The build checkout reads the same .env for migrations.
            ln -sfn "$SHARED/.env" apps/api/.env

            # --- Build everything this server needs ---
            pnpm install --frozen-lockfile
            pnpm run build:libs
            NODE_ENV=production pnpm --filter @arkyc/api build
            pnpm --filter @arkyc/dashboard build

            # --- Migrations + route count run from the full build (reliable toolchain) ---
            pnpm ark migrate
            ROUTE_LIST_OUTPUT="$(pnpm ark route:list)"
            printf '%s\n' "$ROUTE_LIST_OUTPUT"
            ROUTES_COUNT="$(printf '%s\n' "$ROUTE_LIST_OUTPUT" | sed -nE 's/.*Total routes[[:space:]]+([0-9]+).*/\1/p' | tail -n 1)"
            if [ -z "$ROUTES_COUNT" ]; then
              echo "Unable to extract the published route count."
              exit 1
            fi

            # --- Build the standalone API artifact (flat node_modules, prod-only) ---
            rm -rf "$RELEASE"
            pnpm --filter=@arkyc/api deploy --prod "$RELEASE"
            # `.arkstack` is gitignored, so pnpm deploy skips the compiled server — copy it.
            rm -rf "$RELEASE/.arkstack"
            cp -r apps/api/.arkstack "$RELEASE/.arkstack"
            # Wire shared state into the artifact, then link public storage.
            ln -sfn "$SHARED/.env" "$RELEASE/.env"
            ln -sfn "$SHARED/storage" "$RELEASE/storage"
            ( cd "$RELEASE" && pnpm exec ark storage:link --force )

            # --- (Re)start the standalone API under PM2 ---
            pm2 startOrReload "$DEPLOY_PATH/ecosystem.config.cjs" --update-env
            pm2 save

            echo "https://$(basename "$DEPLOY_PATH")|$DEPLOY_BRANCH|$ROUTES_COUNT"

      - name: Deploy website on staging server
        uses: appleboy/ssh-action@v1
        with:
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            set -e
            PNPM_VERSION="10.6.1"
            # The website lives in its own checkout/deploy path on the server.
            WEBSITE_PATH="${{ secrets.WEBSITE_DEPLOY_PATH }}"
            DEPLOY_BRANCH="${{ github.ref_name }}"
            cd "$WEBSITE_PATH"
            git config --global --add safe.directory "$WEBSITE_PATH"
            git fetch --all --prune
            git checkout "$DEPLOY_BRANCH"
            git reset --hard "origin/$DEPLOY_BRANCH"

            source ~/.nvm/nvm.sh
            corepack enable
            corepack prepare "pnpm@${PNPM_VERSION}" --activate

            pnpm install --frozen-lockfile
            pnpm --filter @arkyc/website build
            # Static build — the web server serves apps/website/dist directly; no restart needed.

      - name: Extract deploy meta
        id: deploy_meta
        run: |
          cat <<'DEPLOY_EOF' > /tmp/deploy_output.txt
          ${{ steps.ssh.outputs.stdout }}
          DEPLOY_EOF
          raw=$(grep -oP 'https://[^|]+\|.+' /tmp/deploy_output.txt)
          url="${raw%%|*}"
          deploy_meta="${raw#*|}"
          branch="${deploy_meta%%|*}"
          routes_count="${raw##*|}"
          echo "url=$url" >> $GITHUB_OUTPUT
          echo "branch=$branch" >> $GITHUB_OUTPUT
          echo "routes_count=$routes_count" >> $GITHUB_OUTPUT

      - name: Publish summary
        if: '${{steps.deploy_meta.outputs.url && steps.deploy_meta.outputs.branch && steps.deploy_meta.outputs.routes_count}}'
        run: |
          URL="${{steps.deploy_meta.outputs.url}}"
          BRANCH="${{steps.deploy_meta.outputs.branch}}"
          ROUTES_COUNT="${{steps.deploy_meta.outputs.routes_count}}"

          echo "✅ Successfully Deployed Staging." >> $GITHUB_STEP_SUMMARY
          echo "Deploy Branch: $BRANCH" >> $GITHUB_STEP_SUMMARY
          echo "Deploy URL: $URL" >> $GITHUB_STEP_SUMMARY
          echo "Published Routes: $ROUTES_COUNT" >> $GITHUB_STEP_SUMMARY
          echo "Health Check: $URL/health?human" >> $GITHUB_STEP_SUMMARY

  deploy-production:
    name: Production Deployment
    if: github.event_name == 'push' && github.ref == 'refs/heads/production'
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: deploy-production
      cancel-in-progress: true

    steps:
      - name: Deploy API & dashboard on production server
        uses: appleboy/ssh-action@v1
        id: ssh
        with:
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          port: ${{ secrets.SSH_PORT }}
          capture_stdout: true
          script: |
            set -e
            PNPM_VERSION="10.6.1"
            DEPLOY_PATH="${{ secrets.DEPLOY_PATH }}"
            DEPLOY_BRANCH="production"
            SHARED="$DEPLOY_PATH/shared"   # persistent across deploys
            RELEASE="$DEPLOY_PATH/current" # the standalone API artifact we run

            # --- Update the build checkout (build source only) ---
            cd "$DEPLOY_PATH"
            git config --global --add safe.directory "$DEPLOY_PATH"
            git fetch --all --prune
            git checkout "$DEPLOY_BRANCH"
            git reset --hard "origin/$DEPLOY_BRANCH"

            source ~/.nvm/nvm.sh
            echo "node $(node -v) · pnpm $(pnpm -v) · pm2 $(pm2 -v)"
            corepack enable
            corepack prepare "pnpm@${PNPM_VERSION}" --activate

            # --- Persistent shared state ($DEPLOY_PATH/shared): .env + storage ---
            mkdir -p "$SHARED/storage/app"
            if [ ! -f "$SHARED/.env" ]; then
              cp apps/api/.env.example "$SHARED/.env"
              echo "::warning::Seeded $SHARED/.env from .env.example — set APP_KEY, DATABASE_URL, etc."
            fi
            if [ -n "${{ secrets.FIREBASE_ADMINSDK }}" ]; then
              printf '%s\n' '${{ secrets.FIREBASE_ADMINSDK }}' > "$SHARED/storage/app/firebase-adminsdk.json"
              chmod 600 "$SHARED/storage/app/firebase-adminsdk.json"
            fi
