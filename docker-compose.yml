services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: arkyc
      POSTGRES_PASSWORD: arkyc
      POSTGRES_DB: arkyc
    ports:
      - "5432:5432"
    volumes:
      - arkyc_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U arkyc"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: arkyc
      MINIO_ROOT_PASSWORD: arkyc-secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - arkyc_minio:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - arkyc_redis:/data

volumes:
  arkyc_pg:
  arkyc_minio:
  arkyc_redis:
