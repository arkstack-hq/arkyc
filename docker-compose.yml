services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: arkyc
      POSTGRES_PASSWORD: arkyc
      POSTGRES_DB: arkyc
    ports:
      - "5432:5432"
    volumes:
      - arkyc_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U arkyc"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: arkyc
      MINIO_ROOT_PASSWORD: arkyc-secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - arkyc_minio:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - arkyc_redis:/data

  # Soketi — self-hostable, Pusher-compatible WebSocket server (Phase 16 realtime).
  soketi:
    image: quay.io/soketi/soketi:latest-16-alpine
    restart: unless-stopped
    ports:
      - "6001:6001"
    environment:
      SOKETI_DEBUG: "1"
      SOKETI_DEFAULT_APP_ID: arkyc
      SOKETI_DEFAULT_APP_KEY: arkyc-key
      SOKETI_DEFAULT_APP_SECRET: arkyc-secret
      # Private channels are authorized by the API at /api/v1/realtime/auth.
      SOKETI_DEFAULT_APP_ENABLE_CLIENT_MESSAGES: "false"

volumes:
  arkyc_pg:
  arkyc_minio:
  arkyc_redis:
